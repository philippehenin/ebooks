name: Athena Ebook Library CI/CD

on:
  push:
    branches: [ master, gh-pages ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node.js Dependencies
        run: |
          npm install jsdom

      - name: Run Master Unit & Integration Test Suite
        run: |
          python3 -m unittest discover -s tests -v

      - name: Verify Catalog Integrity
        run: |
          python3 cli.py verify
